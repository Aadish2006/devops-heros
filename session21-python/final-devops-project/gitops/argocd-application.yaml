apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-devops-taskboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Aadish2006/devops-heros.git'
    targetRevision: HEAD
    path: session21-python/final-devops-project/helm/taskboard
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: taskboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
