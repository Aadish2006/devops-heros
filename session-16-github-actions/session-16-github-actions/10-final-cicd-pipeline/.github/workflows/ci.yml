name: CI/CD Pipeline - Test, Build, Security & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI PIPELINE: Automated Testing
  # ==========================================
  test:
    name: 🧪 Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with pytest
        run: |
          pytest -v --junitxml=test-results.xml

  # ==========================================
  # 2. CI PIPELINE: Security Audit
  # ==========================================
  security-check:
    name: 🔒 Security & Secrets Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Scan for leaked secrets & sensitive credentials
        run: |
          echo "Scanning repository for accidentally committed secrets (.env, *.pem, *.key)..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "::error::Potential sensitive secret file detected!"
            exit 1
          fi
          echo "✅ Security scan passed. No secrets exposed."

  # ==========================================
  # 3. CI PIPELINE: Build & Package Artifact
  # ==========================================
  build:
    name: 📦 Build Application Artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run application build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify build bundle
        run: |
          cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: build/
          retention-days: 7

  # ==========================================
  # 4. CD PIPELINE: Containerize & Deploy
  # ==========================================
  deploy:
    name: 🚀 Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: [test, security-check, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: calculator-build
          path: build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        run: |
          echo "Building production Docker image from Dockerfile..."
          docker build -t session16-calculator:${{ github.sha }} -t session16-calculator:latest .

      - name: Simulate Deployment with Secrets Injection
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV || 'production' }}
          DEPLOY_REGION: "us-east-1"
        run: |
          echo "========================================="
          echo "Deploying to target environment: $DEPLOY_ENV"
          echo "Deployment region: $DEPLOY_REGION"
          echo "Release commit: ${{ github.sha }}"
          echo "Container image: session16-calculator:latest"
          echo "========================================="
          echo "Verifying container image runtime..."
          docker run --rm session16-calculator:latest python -c "from app.calculator import add; print('Smoke Test: 10 + 20 =', add(10, 20))"
          echo "✅ CD Deployment completed successfully."
